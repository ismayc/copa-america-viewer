<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copa América 2024 — Schedule Viewer</title>
    <meta
      name="description"
      content="All 32 matches of CONMEBOL Copa América 2024 in your timezone — scores, group standings, the knockout bracket, and where each match was played."
    />
    <meta name="theme-color" content="#0a1430" />
    <link rel="canonical" href="https://copa-america-viewer.netlify.app/" />

    <!-- PWA: installable to home screen, standalone launch -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Copa América 2024" />

    <!-- Open Graph (link previews in Slack/Discord/iMessage/Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Copa América 2024 Schedule Viewer" />
    <meta property="og:title" content="Copa América 2024 — Schedule Viewer" />
    <meta
      property="og:description"
      content="All 32 matches in your timezone — scores, standings, and the knockout bracket."
    />
    <meta property="og:url" content="https://copa-america-viewer.netlify.app/" />
    <meta property="og:image" content="https://copa-america-viewer.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Copa América 2024 Schedule Viewer" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Copa América 2024 — Schedule Viewer" />
    <meta
      name="twitter:description"
      content="All 32 matches in your timezone — scores, standings, and the knockout bracket."
    />
    <meta name="twitter:image" content="https://copa-america-viewer.netlify.app/og-image.png" />
    <script>
      // Set the theme before paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem('copa:theme')
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
